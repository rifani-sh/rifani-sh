# ──────────────────────────────────────────────────────────────
#  ♟  Chess Bot — GitHub Profile
#
#  Triggers when anyone opens an issue with title:
#    "chess: <move>"   e.g. "chess: e2e4" or "chess: Nf3"
#    "chess: reset"    to start a new game
#
#  Workflow:
#    1. Validate & apply the move
#    2. Regenerate board SVG
#    3. Update README with new move links
#    4. Commit everything
#    5. Comment on & close the issue
# ──────────────────────────────────────────────────────────────

name: ♟ Chess Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      move:
        description: 'Move in UCI or SAN format (e.g. e2e4, Nf3, reset)'
        required: true
        default: 'reset'

jobs:
  chess:
    # Only run for chess issues (or manual trigger)
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, 'chess:')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues:   write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install chess library
        run: pip install chess

      - name: ♟ Apply move
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TITLE="chess: ${{ github.event.inputs.move }}"
            PLAYER="rifani890"
          else
            TITLE="${{ github.event.issue.title }}"
            PLAYER="${{ github.event.issue.user.login }}"
          fi
          python chess/make_move.py "$TITLE" "$PLAYER"

      - name: 💾 Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "♟ chess: move by @${{ github.event.issue.user.login || 'rifani890' }}"
          file_pattern: "chess/board.svg chess/game.fen chess/moves.json README.md"
          commit_user_name:  "Chess Bot"
          commit_user_email: "chess-bot@users.noreply.github.com"

      - name: 💬 Comment on issue
        if: github.event_name == 'issues'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ♟ **Move applied!** The board has been updated.

            👉 [View the updated board →](https://github.com/${{ github.repository }}#-chess--play-against-the-world)

            Thanks for playing, @${{ github.event.issue.user.login }}! 🎉

      - name: ✅ Close issue
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
