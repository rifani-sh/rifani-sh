<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Buster — Rifani's Dev Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }

    h1 {
      color: #FF6B6B;
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    canvas {
      display: block;
      max-width: 680px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    p {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <h1>RIFANI.DEV</h1>
  <canvas id="gc"></canvas>
  <p>← → Arrow Keys or Mouse/Touch to Move</p>
  <script>
    const canvas = document.getElementById('gc');
    const ctx = canvas.getContext('2d');
    const W = 680, H = 460;
    canvas.width = W; canvas.height = H;

    let state = 'menu', score = 0, lives = 3, level = 1, frame = 0;
    let player = { x: W / 2, y: H - 65, w: 54, h: 40, speed: 7, dx: 0 };
    let items = [], particles = [], flashTimer = 0, flashColor = '';
    let mouseX = W / 2;
    let keys = {};

    function rrect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ((state === 'menu' || state === 'over') && (e.key === 'Enter' || e.key === ' ')) startGame();
      if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouseX = (e.clientX - r.left) * (W / r.width);
    });
    canvas.addEventListener('click', () => { if (state !== 'playing') startGame(); });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
    }, { passive: false });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') startGame();
      const r = canvas.getBoundingClientRect();
      mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
    }, { passive: false });

    function startGame() {
      state = 'playing'; score = 0; lives = 3; level = 1; items = []; particles = []; frame = 0;
      player.x = W / 2; mouseX = W / 2;
    }

    function spawnItem() {
      const isBug = Math.random() < (0.28 + level * 0.02);
      items.push({
        x: 35 + Math.random() * (W - 70), y: -35, type: isBug ? 'bug' : 'coffee',
        speed: 1.8 + level * 0.4 + Math.random() * 1.5, phase: Math.random() * Math.PI * 2, r: 22
      });
    }

    function burst(x, y, col, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 5;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col, life: 1, sz: 2 + Math.random() * 5 });
      }
    }

    function update() {
      if (state !== 'playing') return;
      const useMouse = !keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['a'] && !keys['d'] && !keys['A'] && !keys['D'];
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.dx = -player.speed;
      else if (keys['ArrowRight'] || keys['d'] || keys['D']) player.dx = player.speed;
      else if (useMouse) {
        const d = mouseX - player.x;
        player.dx = Math.abs(d) > 4 ? Math.sign(d) * Math.min(Math.abs(d) * 0.18, player.speed) : 0;
      }
      player.x = Math.max(29, Math.min(W - 29, player.x + player.dx));

      const rate = Math.max(28, 80 - level * 7);
      if (frame % rate === 0) spawnItem();
      if (score > level * 150) level = Math.min(10, level + 1);

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed; it.x += Math.sin(frame * 0.04 + it.phase) * 0.8;
        const dx = it.x - player.x, dy = it.y - (player.y - 18);
        if (Math.sqrt(dx * dx + dy * dy) < it.r + 24) {
          items.splice(i, 1);
          if (it.type === 'coffee') { score += 10; burst(it.x, it.y, '#F59E0B', 14); flashColor = '#F59E0B'; flashTimer = 6; }
          else { lives--; burst(it.x, it.y, '#EF4444', 18); flashColor = '#EF4444'; flashTimer = 12; if (lives <= 0) state = 'over'; }
          continue;
        }
        if (it.y > H + 40) items.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.028;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (flashTimer > 0) flashTimer--;
    }

    function drawBg() {
      ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#1c2230'; ctx.lineWidth = 0.5;
      for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }

    function drawPlayer() {
      const x = player.x, y = player.y, bob = Math.sin(frame * 0.12) * 1.5;
      ctx.fillStyle = 'rgba(255,107,107,0.2)';
      ctx.beginPath(); ctx.ellipse(x, y + 8, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
      const fl = 4 + Math.sin(frame * 0.3) * 2;
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath(); ctx.moveTo(x - 10, y + 2); ctx.lineTo(x - 5, y + 2 + fl); ctx.lineTo(x, y + 2); ctx.fill();
      ctx.fillStyle = '#FCD34D';
      ctx.beginPath(); ctx.moveTo(x - 8, y + 2); ctx.lineTo(x - 5, y + fl - 1); ctx.lineTo(x - 2, y + 2); ctx.fill();
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath(); ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + 7, y + 2 + fl); ctx.lineTo(x + 12, y + 2); ctx.fill();
      ctx.fillStyle = '#FCD34D';
      ctx.beginPath(); ctx.moveTo(x + 4, y + 2); ctx.lineTo(x + 7, y + fl - 1); ctx.lineTo(x + 10, y + 2); ctx.fill();
      ctx.fillStyle = '#FF6B6B'; rrect(x - 22, y - 38 + bob, 44, 38, 8); ctx.fill();
      ctx.fillStyle = '#0d1117'; rrect(x - 15, y - 33 + bob, 30, 20, 4); ctx.fill();
      ctx.fillStyle = '#22C55E'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
      ctx.fillText('</', x - 4, y - 20 + bob);
      ctx.fillStyle = '#FF6B6B'; ctx.fillText('>', x + 8, y - 20 + bob);
      ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 38 + bob); ctx.lineTo(x, y - 50 + bob); ctx.stroke();
      ctx.fillStyle = '#FCD34D'; ctx.beginPath(); ctx.arc(x, y - 52 + bob, 4, 0, Math.PI * 2); ctx.fill();
    }

    function drawCoffee(it) {
      const { x, y, phase } = it;
      ctx.fillStyle = '#D97706';
      ctx.beginPath(); ctx.moveTo(x - 11, y - 8); ctx.lineTo(x - 9, y + 12); ctx.lineTo(x + 9, y + 12); ctx.lineTo(x + 11, y - 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FBBF24'; rrect(x - 13, y - 13, 26, 7, 3); ctx.fill();
      ctx.fillStyle = '#92400E'; rrect(x - 12, y - 13, 24, 4, 2); ctx.fill();
      ctx.strokeStyle = '#D97706'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + 14, y + 2, 7, -0.8, 1.2); ctx.stroke();
      ctx.fillStyle = '#FDE68A'; ctx.beginPath(); ctx.arc(x, y + 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
      for (let j = -1; j <= 1; j++) {
        const sx = x + j * 6, sw = Math.sin(frame * 0.07 + phase + j) * 3;
        ctx.beginPath(); ctx.moveTo(sx, y - 16); ctx.quadraticCurveTo(sx + sw, y - 26, sx, y - 36); ctx.stroke();
      }
    }

    function drawBug(it) {
      const { x, y, phase } = it, bob = Math.sin(frame * 0.12 + phase) * 2;
      ctx.fillStyle = 'rgba(239,68,68,0.12)'; ctx.beginPath(); ctx.ellipse(x, y + 16, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      for (let j = 0; j < 3; j++) {
        const ly = y + bob + j * 5 - 5;
        ctx.beginPath(); ctx.moveTo(x - 12, ly); ctx.lineTo(x - 22, ly - 5 + j * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 12, ly); ctx.lineTo(x + 22, ly - 5 + j * 2); ctx.stroke();
      }
      ctx.fillStyle = '#EF4444'; ctx.beginPath(); ctx.ellipse(x, y + 4 + bob, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#991B1B'; ctx.beginPath(); ctx.arc(x - 5, y + 4 + bob, 3, 0, Math.PI * 2); ctx.arc(x + 5, y + 4 + bob, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#DC2626'; ctx.beginPath(); ctx.arc(x, y - 8 + bob, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(x - 4, y - 9 + bob, 3, 0, Math.PI * 2); ctx.arc(x + 4, y - 9 + bob, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x - 3.5, y - 9 + bob, 1.2, 0, Math.PI * 2); ctx.arc(x + 4.5, y - 9 + bob, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x - 3, y - 17 + bob); ctx.lineTo(x - 8, y - 26 + bob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 3, y - 17 + bob); ctx.lineTo(x + 8, y - 26 + bob); ctx.stroke();
      ctx.fillStyle = '#FBBF24'; ctx.beginPath(); ctx.arc(x - 8, y - 26 + bob, 2.5, 0, Math.PI * 2); ctx.arc(x + 8, y - 26 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    function drawHUD() {
      ctx.fillStyle = 'rgba(255,107,107,0.1)'; rrect(8, 8, 160, 38, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,107,107,0.3)'; ctx.lineWidth = 0.5; rrect(8, 8, 160, 38, 8); ctx.stroke();
      ctx.fillStyle = '#FF6B6B'; ctx.font = '11px monospace'; ctx.textAlign = 'left'; ctx.fillText('SCORE', 16, 25);
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 18px monospace'; ctx.fillText(score, 16, 43);
      ctx.fillStyle = 'rgba(34,197,94,0.1)'; rrect(W / 2 - 40, 8, 80, 38, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(34,197,94,0.3)'; ctx.lineWidth = 0.5; rrect(W / 2 - 40, 8, 80, 38, 8); ctx.stroke();
      ctx.fillStyle = '#22C55E'; ctx.font = '11px monospace'; ctx.textAlign = 'center'; ctx.fillText('LEVEL', W / 2, 25);
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 18px monospace'; ctx.fillText(level, W / 2, 43);
      ctx.fillStyle = 'rgba(239,68,68,0.1)'; rrect(W - 168, 8, 160, 38, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(239,68,68,0.3)'; ctx.lineWidth = 0.5; rrect(W - 168, 8, 160, 38, 8); ctx.stroke();
      ctx.fillStyle = '#EF4444'; ctx.font = '11px monospace'; ctx.textAlign = 'right'; ctx.fillText('LIVES', W - 16, 25);
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 17px monospace';
      let hearts = ''; for (let i = 0; i < 3; i++)hearts += i < lives ? '♥ ' : '♡ ';
      ctx.fillText(hearts.trim(), W - 16, 43);
      ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,107,107,0.15)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, player.y + 14); ctx.lineTo(W, player.y + 14); ctx.stroke();
      ctx.setLineDash([]);
      if (flashTimer > 0) {
        const alpha = (flashTimer / 12) * 0.15;
        if (flashColor === '#F59E0B') ctx.fillStyle = `rgba(245,158,11,${alpha})`;
        else ctx.fillStyle = `rgba(239,68,68,${alpha})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawOverlay(title, sub1, sub2) {
      ctx.fillStyle = 'rgba(10,14,20,0.88)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.03)'; rrect(W / 2 - 200, H / 2 - 130, 400, 260, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(255,107,107,0.3)'; ctx.lineWidth = 1; rrect(W / 2 - 200, H / 2 - 130, 400, 260, 16); ctx.stroke();
      for (let y = H / 2 - 130; y < H / 2 + 130; y += 4) { ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(W / 2 - 200, y, 400, 2); }
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FF6B6B'; ctx.font = 'bold 40px monospace'; ctx.fillText(title, W / 2, H / 2 - 70);
      ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.font = '15px monospace';
      ctx.fillText(sub1, W / 2, H / 2 - 20); ctx.fillText(sub2, W / 2, H / 2 + 12);
      const pulse = 0.6 + 0.4 * Math.sin(frame * 0.06);
      ctx.globalAlpha = pulse; ctx.fillStyle = '#FF6B6B'; ctx.font = 'bold 14px monospace';
      ctx.fillText('[ CLICK  /  ENTER  /  TAP  TO  START ]', W / 2, H / 2 + 70);
      ctx.globalAlpha = 1;
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(10,14,20,0.9)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.03)'; rrect(W / 2 - 220, H / 2 - 140, 440, 280, 16); ctx.fill();
      ctx.strokeStyle = 'rgba(239,68,68,0.4)'; ctx.lineWidth = 1; rrect(W / 2 - 220, H / 2 - 140, 440, 280, 16); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#EF4444'; ctx.font = 'bold 38px monospace'; ctx.fillText('GAME OVER', W / 2, H / 2 - 80);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '13px monospace'; ctx.fillText('FINAL SCORE', W / 2, H / 2 - 35);
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 44px monospace'; ctx.fillText(score, W / 2, H / 2 + 10);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '13px monospace'; ctx.fillText('LEVEL REACHED: ' + level, W / 2, H / 2 + 38);
      const pulse = 0.6 + 0.4 * Math.sin(frame * 0.06);
      ctx.globalAlpha = pulse; ctx.fillStyle = '#FF6B6B'; ctx.font = 'bold 14px monospace';
      ctx.fillText('[ CLICK  /  ENTER  /  TAP  TO  RETRY ]', W / 2, H / 2 + 90);
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBg();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (const it of items) { if (it.type === 'coffee') drawCoffee(it); else drawBug(it); }
      if (state === 'playing') { drawPlayer(); drawHUD(); }
      if (state === 'menu') drawOverlay('BUG BUSTER', '☕ Catch coffee  +10 pts', '🐛 Dodge bugs or lose a life!');
      if (state === 'over') drawGameOver();
    }

    function loop() { update(); draw(); frame++; requestAnimationFrame(loop); }
    loop();
  </script>
</body>

</html>
